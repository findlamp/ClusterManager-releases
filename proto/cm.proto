syntax = "proto3";

package cm.v1;

// Strongly-typed node-to-node and control-plane-to-node RPC protocol.
// Replaces cmkit's dynamic pickle-based RemoteObject service.
service ClusterNode {
  // Open health check (exempt from Bearer token auth so UI can distinguish
  // "unreachable" from "wrong token").
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckReply);

  // Node metadata, resources, and active groups.
  rpc GetNodeInfo(GetNodeInfoRequest) returns (NodeInfo);

  // Cluster roster discovery (RANK / WORLD_SIZE / MASTER_ADDR registration).
  rpc RegisterMember(ClusterMemberInfo) returns (RegisterMemberReply);
  rpc QueryRoster(QueryRosterRequest) returns (ClusterRosterReply);

  // Gateway batch aggregation: Seed/Gateway fans out GetNodeInfo + ScanGroups
  // across cluster peers over LAN and returns one compressed snapshot.
  rpc GetClusterSnapshot(GetClusterSnapshotRequest) returns (GetClusterSnapshotReply);

  // Task group lifecycle.
  rpc ScanGroups(ScanGroupsRequest) returns (ScanGroupsReply);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupReply);
  rpc DestroyGroup(DestroyGroupRequest) returns (DestroyGroupReply);

  // Per-group Raft consensus RPCs (multiplexed by group_id).
  rpc RaftRequestVote(RaftRequestVoteRequest) returns (RaftRequestVoteReply);
  rpc RaftAppendEntries(RaftAppendEntriesRequest) returns (RaftAppendEntriesReply);
  rpc RaftInstallSnapshot(RaftInstallSnapshotRequest) returns (RaftInstallSnapshotReply);

  // Group operations & status.
  rpc Propose(ProposeRequest) returns (ProposeReply);
  rpc GetGroupStatus(GetGroupStatusRequest) returns (GroupStatusReply);
  rpc GetGroupWorkers(GetGroupWorkersRequest) returns (GroupWorkersReply);
  rpc ReadTerminalTail(ReadTerminalTailRequest) returns (ReadTerminalTailReply);

  // Live bidirectional interactive terminal stream (scrollback + live output + stdin + resize).
  rpc TerminalStream(stream TerminalClientFrame) returns (stream TerminalServerFrame);

  // Phase 2: Experiments tracking (cm_sdk.track JSONL) & host/GPU system telemetry.
  rpc ListExperiments(ListExperimentsRequest) returns (ListExperimentsReply);
  rpc QueryExperimentSeries(QueryExperimentSeriesRequest) returns (QueryExperimentSeriesReply);
  rpc QueryNodeSystemMetrics(QueryNodeSystemMetricsRequest) returns (QueryNodeSystemMetricsReply);

  // Phase 3: Debug panel (py-spy stack scans, cm_sdk.dbg breakpoints/eval, PerfMonitor bars, Perfetto traces).
  rpc ScanStacks(ScanStacksRequest) returns (ScanStacksReply);
  rpc ListDebugProcesses(ListDebugProcessesRequest) returns (ListDebugProcessesReply);
  rpc DebugProcessRpc(DebugProcessRpcRequest) returns (DebugProcessRpcReply);
  rpc PushPerfFrame(PushPerfFrameRequest) returns (PushPerfFrameReply);
  rpc QueryPerfFrames(QueryPerfFramesRequest) returns (QueryPerfFramesReply);
  rpc ClearPerfFrames(ClearPerfFramesRequest) returns (ClearPerfFramesReply);
  rpc ListPerfettoTraces(ListPerfettoTracesRequest) returns (ListPerfettoTracesReply);
  rpc GetPerfettoTrace(GetPerfettoTraceRequest) returns (GetPerfettoTraceReply);
  rpc DeletePerfettoTraces(DeletePerfettoTracesRequest) returns (DeletePerfettoTracesReply);

  // Plan C: Remote cluster-side native Perfetto Trace Processor RPC (zero multi-GB download to client).
  rpc OpenRemotePerfetto(OpenRemotePerfettoRequest) returns (OpenRemotePerfettoReply);
  rpc CloseRemotePerfetto(CloseRemotePerfettoRequest) returns (CloseRemotePerfettoReply);
  rpc PerfettoRpcStatus(PerfettoRpcStatusRequest) returns (PerfettoRpcStatusReply);
  rpc PerfettoRpcStream(stream PerfettoRpcChunk) returns (stream PerfettoRpcChunk);

  // System Blueprint: Dedicated system telemetry (Rank-0 aggregated, separate from cm_sdk.track)
  // & all-nodes service readiness verification API.
  rpc PushSystemTelemetry(PushSystemTelemetryRequest) returns (PushSystemTelemetryReply);
  rpc QueryGroupSystemTelemetry(QueryGroupSystemTelemetryRequest) returns (QueryGroupSystemTelemetryReply);
  rpc CheckGroupReadiness(CheckGroupReadinessRequest) returns (CheckGroupReadinessReply);
}

// ---------------------------------------------------------------------------
// Health & Node Info
// ---------------------------------------------------------------------------

message HealthCheckRequest {}

message HealthCheckReply {
  bool ok = 1;
  string uid = 2;
  string version = 3;
  bool auth_required = 4;
}

message ResourceInfo {
  uint32 num_cpu = 1;
  uint32 num_mem_gb = 2;
  uint32 num_gpu = 3;
  string gpu_type = 4;
}

message GetNodeInfoRequest {}

message NodeInfo {
  string uid = 1;
  string url = 2;
  int32 rank = 3;
  int32 world_size = 4;
  ResourceInfo total_resources = 5;
  ResourceInfo remaining_resources = 6;
  repeated string group_ids = 7;
  string exec_mode = 8;
}

// ---------------------------------------------------------------------------
// Cluster Roster
// ---------------------------------------------------------------------------

message ClusterMemberInfo {
  string uid = 1;
  string url = 2;
  int32 rank = 3;
  int32 world_size = 4;
}

message RegisterMemberReply {
  bool accepted = 1;
  uint32 known_members = 2;
}

message QueryRosterRequest {}

message ClusterRosterReply {
  repeated ClusterMemberInfo members = 1;
  int32 world_size = 2;
}

message GetClusterSnapshotRequest {
  repeated string node_urls = 1;
}

message NodeSnapshotItem {
  string url = 1;
  bool reachable = 2;
  string error = 3;
  NodeInfo info = 4;
  repeated GroupSummary groups = 5;
}

message GetClusterSnapshotReply {
  repeated NodeSnapshotItem nodes = 1;
  bool gateway_supported = 2;
}

// ---------------------------------------------------------------------------
// Task Groups
// ---------------------------------------------------------------------------

message PeerInfo {
  string uid = 1;
  string url = 2;
}

message GroupNodeSpec {
  PeerInfo peer = 1;
  bool is_raft_node = 2;
  bool is_compute_node = 3;
  uint32 rank = 4;
  ResourceInfo resource = 5;
}

message GroupSpec {
  string group_id = 1;
  string group_name = 2;
  repeated GroupNodeSpec nodes = 3;
  uint64 created_at_ms = 4;
}

message ScanGroupsRequest {}

message GroupSummary {
  GroupSpec spec = 1;
  RaftRole raft_role = 2;
  PeerInfo leader = 3;
  GroupCoarseStatus coarse_status = 4;
}

message ScanGroupsReply {
  string node_uid = 1;
  ResourceInfo total_resources = 2;
  ResourceInfo remaining_resources = 3;
  repeated GroupSummary groups = 4;
}

message CreateGroupRequest {
  GroupSpec spec = 1;
}

message CreateGroupReply {
  bool ok = 1;
  string error = 2;
}

message DestroyGroupRequest {
  string group_id = 1;
}

message DestroyGroupReply {
  bool ok = 1;
  string error = 2;
}

// ---------------------------------------------------------------------------
// Raft Consensus
// ---------------------------------------------------------------------------

enum RaftRole {
  RAFT_ROLE_UNKNOWN = 0;
  RAFT_ROLE_FOLLOWER = 1;
  RAFT_ROLE_CANDIDATE = 2;
  RAFT_ROLE_LEADER = 3;
}

enum UserCmdType {
  USER_CMD_SHELL = 0;
  USER_CMD_TRY_CTRL_C = 1;
  USER_CMD_RECONNECT_SSH = 2;
  USER_CMD_REGISTER_WORKER = 3;
  USER_CMD_UNREGISTER_WORKER = 4;
  USER_CMD_KILL_TO_IDLE = 5;
}

message WorkerInfo {
  PeerInfo peer = 1;
  uint32 rank = 2;
  ResourceInfo resource = 3;
}

message UserCmd {
  UserCmdType cmd_type = 1;
  string content = 2;
  WorkerInfo worker_info = 3;
  string launch_id = 4;
  string project_id = 5;
}

message RaftLogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes payload = 3;
}

message RaftRequestVoteRequest {
  string group_id = 1;
  uint64 term = 2;
  string candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}

message RaftRequestVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
}

message RaftAppendEntriesRequest {
  string group_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  string leader_url = 4;
  uint64 prev_log_index = 5;
  uint64 prev_log_term = 6;
  repeated RaftLogEntry entries = 7;
  uint64 leader_commit = 8;
}

message RaftAppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message RaftInstallSnapshotRequest {
  string group_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  string leader_url = 4;
  uint64 last_included_index = 5;
  uint64 last_included_term = 6;
  bytes snapshot_data = 7;
}

message RaftInstallSnapshotReply {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

// ---------------------------------------------------------------------------
// Group Execution & Status
// ---------------------------------------------------------------------------

message ProposeRequest {
  string group_id = 1;
  UserCmd cmd = 2;
}

message ProposeReply {
  bool success = 1;
  bool not_leader = 2;
  PeerInfo leader_hint = 3;
  uint64 committed_index = 4;
  string launch_id = 5;
  string error = 6;
}

enum WorkerExecState {
  WORKER_EXEC_DISCONNECTED = 0;
  WORKER_EXEC_IDLE = 1;
  WORKER_EXEC_RUNNING = 2;
  WORKER_EXEC_ERROR = 3;
}

enum GroupAggregateStatus {
  GROUP_STATUS_UNKNOWN = 0;
  GROUP_STATUS_HAS_DISCONNECTED = 1;
  GROUP_STATUS_HAS_RUNNING = 2;
  GROUP_STATUS_HAS_PARTIAL_RUNNING = 3;
  GROUP_STATUS_HAS_PAUSED = 4;
  GROUP_STATUS_ALL_IDLE_WITH_ERROR = 5;
  GROUP_STATUS_ALL_IDLE = 6;
}

message WorkerRuntimeStatus {
  string uid = 1;
  string url = 2;
  uint32 rank = 3;
  WorkerExecState state = 4;
  int32 exit_code = 5;
  bool has_exit_code = 6;
  bool is_paused = 7;
  int64 last_ts_ms = 8;
  int64 last_output_ts_ms = 9;
  string last_error = 10;
  bool is_raft_node = 11;
  RaftRole raft_role = 12;
}

message GroupCoarseStatus {
  string group_id = 1;
  GroupAggregateStatus aggregate_status = 2;
  uint32 world_size = 3;
  uint32 num_connected = 4;
  string current_cmd = 5;
  string launch_id = 6;
  PeerInfo leader = 7;
  uint64 commit_index = 8;
  int64 last_activity_ms = 9;
}

message GetGroupStatusRequest {
  string group_id = 1;
}

message GroupStatusReply {
  GroupCoarseStatus status = 1;
  WorkerRuntimeStatus local_worker = 2;
}

message GetGroupWorkersRequest {
  string group_id = 1;
}

message GroupWorkersReply {
  GroupCoarseStatus status = 1;
  repeated WorkerRuntimeStatus workers = 2;
}

message ReadTerminalTailRequest {
  string group_id = 1;
  uint32 max_bytes = 2;
}

message ReadTerminalTailReply {
  bytes data = 1;
  WorkerRuntimeStatus worker = 2;
}

// ---------------------------------------------------------------------------
// Live Terminal Stream
// ---------------------------------------------------------------------------

message TerminalOpen {
  string group_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  uint32 replay_bytes = 4;
}

message TerminalInput {
  bytes data = 1;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalClientFrame {
  oneof payload {
    TerminalOpen open = 1;
    TerminalInput input = 2;
    TerminalResize resize = 3;
  }
}

message TerminalOutput {
  bytes data = 1;
  bool is_replay = 2;
}

message TerminalStatusEvent {
  WorkerRuntimeStatus worker = 1;
}

message TerminalServerFrame {
  oneof payload {
    TerminalOutput output = 1;
    TerminalStatusEvent status = 2;
    string error = 3;
  }
}

// ---------------------------------------------------------------------------
// Phase 2: Experiments & System Telemetry
// ---------------------------------------------------------------------------

message ListExperimentsRequest {}

message ExperimentRunSummary {
  string run_id = 1;
  string launch_id = 2;
  string name = 3;
  string group_id = 4;
  string project_id = 5;
  string node_uid = 6;
  // "running", "finished", "error", "unknown"
  string state = 7;
  int64 started_at_ms = 8;
  int64 updated_at_ms = 9;
  int64 first_step = 10;
  int64 last_step = 11;
  bool has_steps = 12;
  repeated string tags = 13;
  repeated uint32 ranks = 14;
  uint32 world_size = 15;
  string gpu_type = 16;
  uint32 num_gpus = 17;
  string headline_tag = 18;
  double headline_value = 19;
  bool has_headline = 20;
  string config_json = 21;
}

message ListExperimentsReply {
  repeated ExperimentRunSummary runs = 1;
}

message QueryExperimentSeriesRequest {
  string launch_id = 1;
  repeated string tags = 2;
  // "step" or "wall" (elapsed seconds since t0)
  string axis = 3;
  uint32 max_points = 4;
  bool has_x_min = 5;
  double x_min = 6;
  bool has_x_max = 7;
  double x_max = 8;
  bool include_system = 9;
}

message MetricSeries {
  string tag = 1;
  string unit = 2;
  bool is_system = 3;
  repeated double xs = 4;
  repeated double ys = 5;
  repeated double mins = 6;
  repeated double maxs = 7;
  uint64 total_points = 8;
}

message QueryExperimentSeriesReply {
  string launch_id = 1;
  repeated MetricSeries series = 2;
}

message QueryNodeSystemMetricsRequest {
  int64 since_ms = 1;
  int64 until_ms = 2;
  uint32 max_points = 3;
}

message QueryNodeSystemMetricsReply {
  string node_uid = 1;
  repeated MetricSeries series = 2;
}

// ---------------------------------------------------------------------------
// Phase 3: Debugging, py-spy Stacks, Performance Monitor & Perfetto Traces
// ---------------------------------------------------------------------------

message ScanStacksRequest {
  string group_id = 1;
  // "python_all" | "group_workers"
  string mode = 2;
}

message StackFrameInfo {
  string name = 1;
  string filename = 2;
  uint32 line = 3;
  string module = 4;
}

message ThreadStackInfo {
  uint64 thread_id = 1;
  string thread_name = 2;
  bool active = 3;
  repeated StackFrameInfo frames = 4;
}

message ProcessStackInfo {
  string node_uid = 1;
  uint32 rank = 2;
  uint32 pid = 3;
  string cmdline = 4;
  repeated ThreadStackInfo threads = 5;
  string error = 6;
}

message ScanStacksReply {
  string node_uid = 1;
  repeated ProcessStackInfo processes = 2;
  string note = 3;
}

message ListDebugProcessesRequest {
  string group_id = 1;
}

message DebugProcessInfo {
  string node_uid = 1;
  uint32 pid = 2;
  int32 rank = 3;
  int32 world_size = 4;
  string group_id = 5;
  string launch_id = 6;
  bool enabled = 7;
  bool paused = 8;
  string breakpoint_name = 9;
  string file = 10;
  uint32 line = 11;
  string func = 12;
}

message ListDebugProcessesReply {
  repeated DebugProcessInfo processes = 1;
}

message DebugProcessRpcRequest {
  uint32 pid = 1;
  // "status" | "stack" | "locals" | "eval" | "release" | "set_enabled"
  string cmd = 2;
  string payload_json = 3;
}

message DebugProcessRpcReply {
  bool ok = 1;
  string response_json = 2;
  string error = 3;
}

message PerfDurationEvent {
  string name = 1;
  uint64 ts_ns = 2;
  uint64 dur_ns = 3;
  uint32 tid = 4;
  string cat = 5;
}

message PerfRankFrame {
  uint32 rank = 1;
  string node_uid = 2;
  repeated PerfDurationEvent events = 3;
  string metadata_json = 4;
}

message PerfStepFrame {
  int64 step = 1;
  string launch_id = 2;
  string run_name = 3;
  repeated PerfRankFrame ranks = 4;
}

message PushPerfFrameRequest {
  string group_id = 1;
  string launch_id = 2;
  string run_name = 3;
  int64 step = 4;
  PerfRankFrame rank_frame = 5;
}

message PushPerfFrameReply {
  bool ok = 1;
  uint32 buffered_steps = 2;
}

message ClearPerfFramesRequest {
  string group_id = 1;
  string launch_id = 2;
}

message ClearPerfFramesReply {
  uint32 cleared_steps = 1;
}

message QueryPerfFramesRequest {
  string group_id = 1;
  string launch_id = 2;
  uint32 max_steps = 3;
  // Optional rank filter; empty means return all ranks.
  repeated uint32 ranks = 4;
  // Optional incremental cursor: return only steps strictly greater than `since_step`.
  int64 since_step = 5;
  bool has_since_step = 6;
}

message QueryPerfFramesReply {
  string launch_id = 1;
  repeated PerfStepFrame steps = 2;
}

message ListPerfettoTracesRequest {
  string group_id = 1;
}

message PerfettoTraceInfo {
  string trace_id = 1;
  string title = 2;
  string launch_id = 3;
  int64 updated_at_ms = 4;
  uint64 size_bytes = 5;
  string source = 6;
  // Sorted list of ranks available in this trace on this node.
  repeated uint32 ranks = 7;
}

message ListPerfettoTracesReply {
  repeated PerfettoTraceInfo traces = 1;
}

message GetPerfettoTraceRequest {
  string trace_id = 1;
  int64 step_filter = 2;
  bool has_step_filter = 3;
  // Optional rank filter to save bandwidth; empty means all ranks.
  repeated uint32 ranks = 4;
}

message GetPerfettoTraceReply {
  string trace_id = 1;
  string title = 2;
  bytes chrome_trace_json = 3;
}

message DeletePerfettoTracesRequest {
  // Optional trace_id ("perf:<launch_id>" or "file:<name>"); empty when delete_all=true.
  string trace_id = 1;
  bool delete_all = 2;
}

message DeletePerfettoTracesReply {
  uint32 deleted_count = 1;
  uint64 freed_bytes = 2;
}

// ---------------------------------------------------------------------------
// Plan C: Remote Cluster-Side Native Perfetto Trace Processor RPC
// ---------------------------------------------------------------------------

message OpenRemotePerfettoRequest {
  string group_id = 1;
  string trace_id = 2;
  int64 step_filter = 3;
  bool has_step_filter = 4;
  // Optional rank filter; empty means all ranks.
  repeated uint32 ranks = 5;
  // Optional peer node URLs in this group so this node can gather missing ranks over fast LAN.
  repeated string peer_urls = 6;
}

message OpenRemotePerfettoReply {
  bool ok = 1;
  string session_id = 2;
  string loaded_trace_name = 3;
  uint64 raw_bytes = 4;
  string version = 5;
  string error = 6;
  // True when remote trace_processor_shell is unavailable so the client should fall back to Plan A+B.
  bool fallback_to_local = 7;
}

message CloseRemotePerfettoRequest {
  string session_id = 1;
}

message CloseRemotePerfettoReply {
  bool ok = 1;
}

message PerfettoRpcStatusRequest {
  string session_id = 1;
}

message PerfettoRpcStatusReply {
  bool ok = 1;
  uint32 http_status = 2;
  string content_type = 3;
  bytes body = 4;
  string error = 5;
}

message PerfettoRpcChunk {
  // Optional session_id on the first client frame; empty defaults to the active session.
  string session_id = 1;
  // Raw Perfetto TraceProcessor binary WebSocket RPC frame payload.
  bytes data = 2;
  // Optional server-to-client error message.
  string error = 3;
}

// ---------------------------------------------------------------------------
// System Blueprint: Rank-0 Aggregated System Telemetry & All-Nodes Readiness
// ---------------------------------------------------------------------------

message SystemLinkSample {
  string target = 1;
  double bytes_per_s = 2;
  uint64 total_bytes = 3;
  double items_per_s = 4;
  int64 updated_at_ms = 5;
}

message PushSystemTelemetryRequest {
  string group_id = 1;
  string launch_id = 2;
  string node_uid = 3;
  uint32 rank = 4;
  // "hw" | "report" | "link" | "ready" | "not_ready" | "starting"
  string kind = 5;
  // "node" (sum across nodes at Rank-0) | "group" (group-wide pre-aggregated value)
  string scope = 6;
  // Optional node hardware snapshot (sent by each node's SysSampler -> Rank-0)
  bool has_hw = 7;
  uint32 num_gpu = 8;
  string gpu_type = 9;
  double gpu_util_pct = 10;
  double gpu_mem_pct = 11;
  double gpu_mem_used_gb = 12;
  double gpu_mem_total_gb = 13;
  double gpu_power_w = 14;
  double gpu_temp_c = 15;
  double cpu_pct = 16;
  double mem_pct = 17;
  // Dedicated cm_sdk.sys business rate fields
  bool has_produce_rate = 18;
  double produce_rate = 19;
  string produce_unit = 20;
  bool has_consume_rate = 21;
  double consume_rate = 22;
  string consume_unit = 23;
  bool has_throughput = 24;
  double throughput = 25;
  string throughput_unit = 26;
  string secondary_label = 27;
  string secondary_value = 28;
  // Dedicated cm_sdk.sys link traffic (strictly SDK-reported)
  SystemLinkSample link = 29;
  // Readiness signal
  bool ready = 30;
  string ready_message = 31;
  string extra_json = 32;
  int64 ts_ms = 33;
}

message PushSystemTelemetryReply {
  bool ok = 1;
}

message QueryGroupSystemTelemetryRequest {
  string group_id = 1;
}

message QueryGroupSystemTelemetryReply {
  string group_id = 1;
  string launch_id = 2;
  // Aggregated hardware across all reporting nodes in the group (at Rank-0)
  uint32 reporting_nodes = 3;
  uint32 total_gpus = 4;
  string gpu_type = 5;
  bool has_gpu = 6;
  double gpu_util_pct = 7;
  double gpu_mem_pct = 8;
  double gpu_mem_used_gb = 9;
  double gpu_mem_total_gb = 10;
  double gpu_power_w = 11;
  double total_power_kw = 12;
  double gpu_temp_c = 13;
  double cpu_pct = 14;
  double mem_pct = 15;
  // Aggregated cm_sdk.sys rates
  bool has_sdk_report = 16;
  bool has_produce_rate = 17;
  double produce_rate = 18;
  string produce_unit = 19;
  bool has_consume_rate = 20;
  double consume_rate = 21;
  string consume_unit = 22;
  bool has_throughput = 23;
  double throughput = 24;
  string throughput_unit = 25;
  string secondary_label = 26;
  string secondary_value = 27;
  // Per-target inter-group link metrics (strictly from cm_sdk.sys.report_link)
  repeated SystemLinkSample links = 28;
  // All-nodes readiness tracking at Rank-0
  uint32 ready_nodes_count = 29;
  uint32 expected_nodes_count = 30;
  repeated string ready_node_uids = 31;
  bool all_nodes_sdk_ready = 32;
  string sdk_ready_message = 33;
  int64 sdk_updated_at_ms = 34;
  string extra_json = 35;
}

message CheckGroupReadinessRequest {
  string group_id = 1;
  // "sdk_ready" | "http_get" | "tcp_port" | "log_regex" | "sdk_or_running"
  string mode = 2;
  uint32 port = 3;
  string http_path = 4;
  string log_pattern = 5;
  string expected_launch_id = 6;
  // If true, only probe this local node (used when Rank-0 fans out or in rank0_only scope).
  bool local_only = 7;
}

message NodeReadinessItem {
  string node_uid = 1;
  uint32 rank = 2;
  bool ready = 3;
  string detail = 4;
}

message CheckGroupReadinessReply {
  bool ready = 1;
  uint32 ready_nodes = 2;
  uint32 total_nodes = 3;
  repeated NodeReadinessItem nodes = 4;
  string launch_id = 5;
  string detail = 6;
  int64 checked_at_ms = 7;
}
